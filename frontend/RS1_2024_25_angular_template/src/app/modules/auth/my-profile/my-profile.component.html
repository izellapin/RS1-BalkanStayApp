<div class="profile-container">
  <div class="sidebar">
    <div class="profile-picture">
      <img src="assets/default-avatar.png" alt="Profile Picture">
    </div>
    <nav class="vertical-menu">
      <a (click)="selectMenuItem('Edit Profile')" [class.active]="selectedMenuItem === 'Edit Profile'" class="menu-item">
        <i class="fas fa-user"></i>
        Edit Profile
      </a>
      <a (click)="selectMenuItem('My Travels')" [class.active]="selectedMenuItem === 'My Travels'" class="menu-item">
        <i class="fas fa-plane"></i>
        My Travels
      </a>
      <a (click)="selectMenuItem('My Bookings')" [class.active]="selectedMenuItem === 'My Bookings'" class="menu-item">
        <i class="fas fa-calendar-check"></i>
        My Bookings
      </a>
      <a (click)="selectMenuItem('Payments')" [class.active]="selectedMenuItem === 'Payments'" class="menu-item">
        <i class="fas fa-credit-card"></i>
        Payments
      </a>
      <a (click)="selectMenuItem('Activities')" [class.active]="selectedMenuItem === 'Activities'" class="menu-item">
        <i class="fas fa-hiking"></i>
        Activities
      </a>
    </nav>
  </div>
  <div class="content">
    <div class="content-wrapper">
      <h2 class="page-title">Edit Profile</h2>

      <div class="profile-form">
        <!-- Profile Image Section -->
        <div class="profile-image-section">
          <div class="image-container">
            <img [src]="profileImageUrl" 
                 alt="Profile Picture"
                 class="profile-image"
                 (error)="profileImageUrl = 'assets/default-avatar.png'">
          </div>
          <div class="upload-button">
            <label for="profile-upload" class="upload-label">
              <i class="fas fa-camera"></i> Change Photo
            </label>
            <input 
              type="file" 
              id="profile-upload" 
              (change)="onImageSelected($event)" 
              accept="image/*" 
              hidden>
          </div>
        </div>

        <!-- Form Section -->
        <form [formGroup]="profileForm" (ngSubmit)="onSubmit()" class="form-container">
          <div class="form-row">
            <div class="form-field">
              <label>First Name</label>
              <input type="text" formControlName="firstName">
            </div>
            <div class="form-field">
              <label>Last Name</label>
              <input type="text" formControlName="lastName">
            </div>
          </div>

          <div class="form-field">
            <label>Email</label>
            <input type="email" formControlName="email">
          </div>

          <div class="form-field">
            <label>Phone Number</label>
            <input type="tel" formControlName="phone">
          </div>

          <div class="form-field">
            <label>Address</label>
            <input type="text" formControlName="address">
          </div>

          <div class="form-row">
            <div class="form-field">
              <label>City</label>
              <input type="text" formControlName="city">
            </div>
            <div class="form-field">
              <label>Country</label>
              <input type="text" formControlName="country">
            </div>
          </div>

          <div class="button-group">
            <button type="submit" class="btn-save">Save Changes</button>
            <button type="button" class="btn-cancel" (click)="resetForm()">Cancel</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
